{% extends "base.html" %}
{% load static %}

{% block title %}
    Edit Profile • NinHub
{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'css/edit.css' %}">
{% endblock %}
    
{% block content %}
<div class="edit-container">

    <div class="edit-card">

        <h1>Edit Profile</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="pfp-section">

                <img id="pfp-preview" src="{{ request.user.profile.pfp.url }}" alt="Profile Picture">

                {{ form.pfp }}

                <label for="{{ form.pfp.id_for_label }}" class="upload-btn">
                    <i class="ri-image-edit-line"></i>
                    Change Photo
                </label>

            </div>

            <div class="field">
                <label>Bio</label>
                {{form.bio}}
            </div>

            <div class="field">
                <label>Website</label>
                {{form.website}}
            </div>

            <div class="field">
                <label>Location</label>
                {{form.location}}
            </div>

            <div class="buttons">
                <a href="{% url 'me' %}" class="cancel-btn">Cancel</a>
                <button type="submit" class="save-btn">Save Changes</button>
            </div>

        </form>

    </div>

</div>

<script>
    const pfpInput = document.getElementById('{{ form.pfp.id_for_label }}');
    const pfpPreview = document.getElementById('pfp-preview');
    const originalSrc = pfpPreview.src;

    pfpInput.addEventListener('change', function () {
        const file = this.files[0];
        if (!file) {
            pfpPreview.src = originalSrc;
            return;
        }

        const reader = new FileReader();
        reader.onload = function (e) {
            pfpPreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
</script>
{% endblock %}
