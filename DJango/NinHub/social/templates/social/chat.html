{% extends "base.html" %}

{% block content %}
<style>
  .chat-page{
    display:flex;
    flex-direction:column;
    height:calc(100vh - 80px);
    background:transparent;
  }

  .chat-header{
    padding-bottom:16px;
    margin-bottom:16px;
    border-bottom:1px solid #30363d;
  }

  .chat-header h2{
    font-size:22px;
    font-weight:600;
  }

  .messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-right:6px;
    background:transparent;
  }

  .messages::-webkit-scrollbar{
    width:6px;
  }
  .messages::-webkit-scrollbar-thumb{
    background:#30363d;
    border-radius:10px;
  }

  .bubble-row{
    display:flex;
    max-width:65%;
  }

  .bubble-row.sent{
    align-self:flex-end;
  }

  .bubble-row.received{
    align-self:flex-start;
  }

  .bubble{
    padding:10px 16px;
    border-radius:10px;
    font-size:14px;
    line-height:1.4;
    border:1px solid #30363d;
    transition:.25s;
  }

  .bubble .sender-name{
    display:block;
    font-size:11px;
    font-weight:700;
    margin-bottom:3px;
    opacity:.7;
  }

  /* dark filled bubble for messages you sent, matches sidebar accent */
  .sent .bubble{
    background:#1f6feb;
    border-color:#1f6feb;
    color:#ffffff;
  }

  /* light bubble for received messages */
  .received .bubble{
    background:#c9d1d9;
    color:#0d1117;
  }

  .received .bubble .sender-name{
    opacity:.6;
  }

  .no-messages{
    margin:auto;
    color:#8b949e;
    font-size:14px;
  }

  .chat-form{
    display:flex;
    gap:10px;
    padding-top:16px;
    margin-top:16px;
    border-top:1px solid #30363d;
  }

  .chat-form input[type="text"]{
    flex:1;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid #30363d;
    background:#161b22;
    color:white;
    font-size:14px;
    outline:none;
    transition:.25s;
  }

  .chat-form input[type="text"]::placeholder{
    color:#8b949e;
  }

  .chat-form input[type="text"]:focus{
    border-color:#1f6feb;
  }

  .chat-form button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#1f6feb;
    color:white;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:.25s;
  }

  .chat-form button:hover{
    background:#388bfd;
  }
</style>

<div class="chat-page">
  <div class="chat-header">
    <h2>{{ other_user.username }}</h2>
  </div>

    <div class="messages" id="messages" data-last-id="{{ messages.last.id|default:0 }}">
        {% for message in messages %}
            <div class="bubble-row {% if message.sender == request.user %}sent{% else %}received{% endif %}" data-id="{{ message.id }}">
                <div class="bubble">
                    <span class="sender-name">{{ message.sender }}</span>
                    {{ message.text }}
                </div>
            </div>
        {% empty %}
            <p class="no-messages">No messages yet.</p>
        {% endfor %}
    </div>

  <form method="POST" class="chat-form">
    {% csrf_token %}
    <input
      type="text"
      name="message"
      autocomplete="off"
      placeholder="Type a message..."
      required
    >
    <button type="submit">Send</button>
  </form>
</div>
<script>
  const messagesBox = document.getElementById('messages');
  const otherUsername = "{{ other_user.username }}";
  const currentUsername = "{{ request.user.username }}";
  let lastId = parseInt(messagesBox.dataset.lastId || '0');

  function appendMessage(sender, text, isMe, id) {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (isMe ? 'sent' : 'received');
    if (id) row.dataset.id = id;
    row.innerHTML = `
      <div class="bubble">
        <span class="sender-name">${sender}</span>
        ${text}
      </div>`;
    messagesBox.appendChild(row);
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  async function pollMessages() {
    try {
      const res = await fetch(`/social/chat/${otherUsername}/poll/?after_id=${lastId}`);
      const data = await res.json();
      data.messages.forEach(msg => {
        appendMessage(msg.sender, msg.text, msg.is_me, msg.id);
        lastId = msg.id;
      });
    } catch (err) {
      console.error('Polling failed:', err);
    }
  }

  setInterval(pollMessages, 2000);

  const form = document.querySelector('.chat-form');
  form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const input = form.querySelector('input[name="message"]');
      const text = input.value.trim();
      if (!text) return;

      const formData = new FormData(form);   // snapshot FIRST, while input still has the text
      input.value = '';                      // clear AFTER snapshot is taken

      await fetch(window.location.pathname, {
        method: 'POST',
        body: formData,
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
      });

      pollMessages();
  });

  messagesBox.scrollTop = messagesBox.scrollHeight;
</script>
{% endblock %}
