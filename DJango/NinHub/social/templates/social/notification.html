{% extends "base.html" %}
{% load humanize %}

{% block content %}
<div style="max-width:700px; margin:auto; padding:20px;">
    <h2 style="margin-bottom:20px;">Notifications</h2>
    {% for n in notifications %}
        <a href="{% url 'chat' n.sender.username %}"
           class="notif-row {% if not n.is_read %}unread{% endif %}">
            <p>{{ n.text }}</p>
            <small style="color:gray;">{{ n.created_at|naturaltime }}</small>
        </a>
    {% empty %}
        <p style="color:gray;">No notifications yet.</p>
    {% endfor %}
</div>

<style>
    .notif-row{
        display:block;
        padding:14px;
        border-radius:10px;
        color:white;
        text-decoration:none;
    }
    .notif-row.unread{
        background:#161b22;
    }
</style>
{% endblock %}
